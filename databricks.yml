bundle:
  name: ecommercev1

resources:
  jobs:
    ecommercev1_medallion:
      name: ecommercev1_medallion_bundle
      performance_target: STANDARD
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.sql

targets:
  dev:
    mode: development
    default: true